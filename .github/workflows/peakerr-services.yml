name: Sync Peakerr Services

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  sync-services:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Load Peakerr service catalog
        env:
          PEAKERR_API_KEY: ${{ secrets.PEAKERR_API_KEY }}
        run: python load_services.py --output data/services.json --summary

      - name: Commit changed catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/services.json
          if git diff --cached --quiet; then
            echo "No service catalog changes."
          else
            git commit -m "chore: sync Peakerr service catalog"
            git push
          fi
